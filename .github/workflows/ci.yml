name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run check (typecheck + lint + test + build)
        run: pnpm check
        env:
          # Dummy values satisfy config.ts Zod schema during tests.
          # Real secrets are never committed — see .env.example.
          ANTHROPIC_API_KEY: ci-placeholder
          MERGE_API_KEY: ci-placeholder
          DATABASE_URL: file:./test.db
          BLUEBUBBLES_SERVER_URL: http://127.0.0.1:1234
          BLUEBUBBLES_SERVER_PASSWORD: ci-placeholder
